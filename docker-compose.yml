services:
  mongo:
    image: mongo:7.0-jammy
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-dev_local_jwt_secret_change_me}
      MONGO_URI: mongodb://mongo:27017/EtherXMeet
      CLIENT_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CLIENT_URL_LAN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      GOOGLE_CALLBACK_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}/api/auth/google/callback
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  meeting-server:
    build:
      context: ./frontend
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
        VITE_MEETING_API_BASE_URL: /meeting-api
        VITE_SOCKET_URL: /
        VITE_100MS_APP_KEY: ${VITE_100MS_APP_KEY:-}
        VITE_100MS_APP_SECRET: ${VITE_100MS_APP_SECRET:-}
        VITE_100MS_DEFAULT_ROLE: ${VITE_100MS_DEFAULT_ROLE:-host}
        VITE_PINATA_JWT: ${VITE_PINATA_JWT:-}
        VITE_PINATA_GATEWAY: ${VITE_PINATA_GATEWAY:-https://gateway.pinata.cloud/ipfs}
        VITE_NETWORK: ${VITE_NETWORK:-localhost}
        VITE_LIVEKIT_WS_URL: ${VITE_LIVEKIT_WS_URL:-}
        VITE_WEB3AUTH_CLIENT_ID: ${VITE_WEB3AUTH_CLIENT_ID:-}
        VITE_CONTRACT_ADDRESS: ${VITE_CONTRACT_ADDRESS:-}
        VITE_POLYGON_RPC_URL: ${VITE_POLYGON_RPC_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
      - meeting-server
    ports:
      - "8080:80"

volumes:
  mongo_data:
